<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <title>بازی ها | Mine Mode</title>

    <link rel="icon" type="image/png" href="icon.png">

    <style>

        body {
            background-image: url("backs.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            text-align: center;
            font-family: Arial;
            margin: 0;
            padding: 0;
        }

        .top-buttons {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 10px;
        }

        .top-buttons a {
            text-decoration: none;
        }

        .top-button {
            padding: 10px 18px;
            background-color: #ddd;
            color: darkgreen;
            border: 1px solid #1893e6;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        .content {
            margin-top: 130px;
        }

        h1 {
            font-size: 40px;
        }

        .game-button {
            display: block;
            width: 550px;
            max-width: 90%;
            margin: 30px auto;
            padding: 15px;
            background-color: #ddd;
            border: 2px solid #1893e6;
            border-radius: 10px;
            cursor: pointer;
            font-size: 24px;
        }

        .game-button img {
            display: block;
            width: 450px;
            max-width: 100%;
            margin: 15px auto;
            border-radius: 8px;
        }

        .back-button {
            margin-top: 40px;
            padding: 15px 30px;
            font-size: 22px;
            cursor: pointer;
            border-radius: 7px;
            border: 2px solid #1893e6;
        }

    </style>

</head>

<body>

    <!-- دکمه های بالا سمت چپ -->

    <div class="top-buttons">

        <a href="games.html">

            <button class="top-button">
                دانلود بازی
            </button>

        </a>

        <a href="mod.html">

            <button class="top-button">
                مود ماینکرفت
            </button>

        </a>

    </div>


    <div class="content">

        <h1>
            بازی ها
        </h1>


        <!-- Scam Click -->

        <a href="scamclick.html">

            <button class="game-button">

                Scam Click

                <img
                    src="gamescam.png"
                    alt="Scam Click"
                >

            </button>

        </a>


        <!-- fire in sky -->

        <a href="fireinsky.html">

            <button class="game-button">

                fire in sky

                <img
                    src="int.png"
                    alt="fire in sky"
                >

            </button>

        </a>


        <!-- بازگشت -->

        <br>

        <a href="index.html">

            <button class="back-button">
                ← بازگشت
            </button>

        </a>

    </div>

</body>

</html>
