<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <title>مود ماینکرفت | Mine Mode</title>

    <link rel="icon" type="image/png" href="icon.png">

    <style>

        body {
            background-image: url("backs.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            text-align: center;
            font-family: Arial;
            margin: 0;
            padding: 0;
        }

        .top-buttons {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 10px;
        }

        .top-buttons a {
            text-decoration: none;
        }

        .top-button {
            padding: 10px 18px;
            background-color: #ddd;
            color: darkgreen;
            border: 1px solid #1893e6;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        .content {
            margin-top: 180px;
        }

        h1 {
            font-size: 35px;
        }

        p {
            font-size: 24px;
        }

        .publish-button {
            padding: 15px 35px;
            background-color: #ddd;
            color: darkgreen;
            border: 2px solid #1893e6;
            border-radius: 7px;
            font-size: 22px;
            cursor: pointer;
        }

        .back-button {
            margin-top: 40px;
            padding: 15px 30px;
            font-size: 22px;
            cursor: pointer;
            border-radius: 7px;
            border: 2px solid #1893e6;
        }

    </style>

</head>

<body>

    <div class="top-buttons">

        <a href="games.html">

            <button class="top-button">
                دانلود بازی
            </button>

        </a>

        <a href="mod.html">

            <button class="top-button">
                مود ماینکرفت
            </button>

        </a>

    </div>


    <div class="content">

        <h1>
            فعلا مودی نیست.
        </h1>

        <p>
            البته اگه تو مودی داری میتونی انتشارش کنی
        </p>

        <br>

        <a href="gameu.html">

            <button class="publish-button">
                انتشار مود
            </button>

        </a>

        <br><br><br>

        <a href="index.html">

            <button class="back-button">
                ← بازگشت
            </button>

        </a>

    </div>

</body>

</html>
