<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <title>Mine Mode | دانلود بازی و مود ماینکرفت</title>

    <meta name="description" content="Mine Mode؛ دانلود بازی‌های مختلف و بازی‌های ساخته شده توسط سازنده سایت.">

    <meta name="keywords" content="Mine Mode, minemodeir, دانلود بازی, بازی کامپیوتری, بازی, مود ماینکرفت">

    <meta name="author" content="Mine Mode">

    <link rel="icon" type="image/png" href="icon.png">

    <style>

        body {
            background-image: url("backs.png");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            text-align: center;
            font-family: Arial;
            margin: 0;
            padding: 0;
        }

        /* دکمه های بالای صفحه */

        .top-buttons {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            gap: 10px;
        }

        .top-buttons a {
            text-decoration: none;
        }

        .top-button {
            padding: 10px 18px;
            background-color: #ddd;
            color: darkgreen;
            border: 1px solid #1893e6;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }

        /* جستجو */

        .search-box {
            width: 350px;
            padding: 15px;
            font-size: 20px;
            border: 2px solid #999;
            border-radius: 10px;
            text-align: right;
            direction: rtl;
            margin-top: 80px;
        }

        .search-results {
            width: 380px;
            margin: 5px auto 30px auto;
            background-color: white;
            border: 1px solid #999;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }

        .result {
            padding: 12px;
            font-size: 18px;
            text-align: right;
            cursor: pointer;
            border-bottom: 1px solid #ddd;
        }

        .result:hover {
            background-color: #eee;
        }

        p {
            font-size: 20px;
        }

        /* دکمه های اصلی */

        .main-button {
            padding: 15px 25px;
            background-color: #ddd;
            color: darkgreen;
            border: 1px solid #1893e6;
            border-radius: 5px;
            font-size: 20px;
            cursor: pointer;
        }

        .publish-button {
            padding: 15px 35px;
            background-color: #ddd;
            color: darkgreen;
            border: 2px solid #1893e6;
            border-radius: 7px;
            font-size: 22px;
            cursor: pointer;
        }

        .support-button {
            padding: 15px 35px;
            background-color: #ddd;
            color: darkgreen;
            border: 2px solid #1893e6;
            border-radius: 7px;
            font-size: 22px;
            cursor: pointer;
        }

        /* بازی ها فقط برای جستجو */

        .game {
            display: none;
        }

    </style>

</head>

<body>


    <!-- دکمه های بالای صفحه -->

    <div class="top-buttons">

        <a href="games.html">

            <button class="top-button">
                دانلود بازی
            </button>

        </a>


        <a href="mod.html">

            <button class="top-button">
                مود ماینکرفت
            </button>

        </a>

    </div>


    <!-- جستجو -->

    <input
        type="text"
        id="search"
        class="search-box"
        placeholder="جست و جو"
    >

    <div
        id="search-results"
        class="search-results">
    </div>


    <!-- متن اصلی -->

    <h1>
        سلام! به سایت ما خوش اومدی!
    </h1>

    <p>
        اینجا قراره یه سری بازی ببینی یا حتی مود ماینکرفت
    </p>


    <!-- اطلاعات بیشتر -->

    <a href="info.html">

        <button class="main-button">
            اطلاعات بیشتر
        </button>

    </a>


    <br><br>


    <!-- انتشار بازی -->

    <a href="gameu.html">

        <button class="publish-button">
            انتشار بازی
        </button>

    </a>


    <br><br><br><br>


    <!-- Scam Click -->

    <div
        class="game"
        data-url="scamclick.html">

        <h2>
            Scam Click
        </h2>

    </div>


    <!-- fire in sky -->

    <div
        class="game"
        data-url="fireinsky.html">

        <h2>
            fire in sky
        </h2>

    </div>


    <br><br><br><br>


    <!-- حمایت مالی -->

    <a href="support.html">

        <button class="support-button">
            حمایت مالی
        </button>

    </a>


    <script>

        const searchBox =
            document.getElementById("search");

        const searchResults =
            document.getElementById("search-results");

        const games =
            document.querySelectorAll(".game");


        searchBox.addEventListener("input", function () {

            const text =
                searchBox.value.toLowerCase().trim();


            searchResults.innerHTML = "";


            if (text === "") {

                searchResults.style.display = "none";

                return;

            }


            let found = false;


            games.forEach(function(game) {

                const gameName =
                    game.querySelector("h2").innerText.trim();

                const gameNameLower =
                    gameName.toLowerCase();


                if (gameNameLower.includes(text)) {

                    found = true;


                    const result =
                        document.createElement("div");


                    result.className = "result";


                    result.innerText = gameName;


                    /* لینک صفحه بازی */

                    const gameUrl =
                        game.getAttribute("data-url");


                    /* کلیک روی نتیجه */

                    result.addEventListener("click", function() {

                        window.location.href = gameUrl;

                    });


                    searchResults.appendChild(result);

                }

            });


            if (found) {

                searchResults.style.display = "block";

            } else {

                searchResults.style.display = "none";

            }

        });

    </script>


</body>

</html>
